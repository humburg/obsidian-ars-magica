[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-ars-magica"
version = "0.1.0"
description = "Tools for enhancing Ars Magica Open License content for use with Obsidian"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
obsidian-ars-magica = "obsidian_ars_magica.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    "src",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

